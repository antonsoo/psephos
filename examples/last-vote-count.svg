<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 426" role="img" aria-labelledby="title description"><title id="title">Equal votes. The defendant wins.</title><desc id="description">5 pierced for the prosecutor; 5 solid for the defendant. ἂν δὲ ἴσαι, ὁ φεύγων: equality favors the defendant. Starting rehearsal: last-vote. Ten is a modern training panel size, not an ancient jury size. Diagram by Anthony Mercer, MIT. Source: Constitution of the Athenians 68.2–69.1, Kenyon 1920.</desc><rect width="620" height="426" fill="#edf4f3"/><g font-family="Georgia, serif" fill="#153d39"><text x="30" y="38" font-size="23">Psephos: bronze count</text><text x="30" y="67" font-size="17">5 pierced / 5 solid; intervention: none</text></g><g transform="translate(30 90)"><rect x="3" y="3" width="534" height="190" rx="20" fill="#f6fbf8" stroke="#b7cdc1" stroke-width="2"/><g transform="translate(58 52)"><circle r="32" fill="#a88a53" stroke="#4d482c" stroke-width="2"/><circle r="24.96" fill="none" stroke="#d5c18e" stroke-width="1.5"/><circle r="10.88" fill="#b99c65" stroke="#4d482c" stroke-width="2"/><circle r="5.76" fill="#153d39"/></g><g transform="translate(164 52)"><circle r="32" fill="#a88a53" stroke="#4d482c" stroke-width="2"/><circle r="24.96" fill="none" stroke="#d5c18e" stroke-width="1.5"/><circle r="10.88" fill="#b99c65" stroke="#4d482c" stroke-width="2"/><circle r="5.76" fill="#153d39"/></g><g transform="translate(270 52)"><circle r="32" fill="#a88a53" stroke="#4d482c" stroke-width="2"/><circle r="24.96" fill="none" stroke="#d5c18e" stroke-width="1.5"/><circle r="10.88" fill="#b99c65" stroke="#4d482c" stroke-width="2"/><circle r="5.76" fill="#153d39"/></g><g transform="translate(376 52)"><circle r="32" fill="#a88a53" stroke="#4d482c" stroke-width="2"/><circle r="24.96" fill="none" stroke="#d5c18e" stroke-width="1.5"/><circle r="10.88" fill="#b99c65" stroke="#4d482c" stroke-width="2"/><circle r="5.76" fill="#153d39"/></g><g transform="translate(482 52)"><circle r="32" fill="#a88a53" stroke="#4d482c" stroke-width="2"/><circle r="24.96" fill="none" stroke="#d5c18e" stroke-width="1.5"/><circle r="10.88" fill="#b99c65" stroke="#4d482c" stroke-width="2"/><circle r="5.76" fill="#153d39"/></g><g transform="translate(58 151)"><circle r="32" fill="#a88a53" stroke="#4d482c" stroke-width="2"/><circle r="24.96" fill="none" stroke="#d5c18e" stroke-width="1.5"/><circle r="10.88" fill="#b99c65" stroke="#4d482c" stroke-width="2"/><circle r="5.76" fill="#b99c65"/></g><g transform="translate(164 151)"><circle r="32" fill="#a88a53" stroke="#4d482c" stroke-width="2"/><circle r="24.96" fill="none" stroke="#d5c18e" stroke-width="1.5"/><circle r="10.88" fill="#b99c65" stroke="#4d482c" stroke-width="2"/><circle r="5.76" fill="#b99c65"/></g><g transform="translate(270 151)"><circle r="32" fill="#a88a53" stroke="#4d482c" stroke-width="2"/><circle r="24.96" fill="none" stroke="#d5c18e" stroke-width="1.5"/><circle r="10.88" fill="#b99c65" stroke="#4d482c" stroke-width="2"/><circle r="5.76" fill="#b99c65"/></g><g transform="translate(376 151)"><circle r="32" fill="#a88a53" stroke="#4d482c" stroke-width="2"/><circle r="24.96" fill="none" stroke="#d5c18e" stroke-width="1.5"/><circle r="10.88" fill="#b99c65" stroke="#4d482c" stroke-width="2"/><circle r="5.76" fill="#b99c65"/></g><g transform="translate(482 151)"><circle r="32" fill="#a88a53" stroke="#4d482c" stroke-width="2"/><circle r="24.96" fill="none" stroke="#d5c18e" stroke-width="1.5"/><circle r="10.88" fill="#b99c65" stroke="#4d482c" stroke-width="2"/><circle r="5.76" fill="#b99c65"/></g></g><g font-family="Georgia, serif" fill="#153d39" font-size="16"><text x="30" y="320">Equal votes. The defendant wins.</text><text x="30" y="351">Modern ten-person teaching panel; schematic drawing.</text><text x="30" y="377">Athenaion Politeia 68–69. Anthony Mercer / MIT.</text></g></svg>